<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لغو عضویت خبرنامه | MAHO Market</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main style="max-width:520px;margin:48px auto;padding:0 16px;font-family:Tahoma,Arial,sans-serif;line-height:1.8">
    <h1>لغو عضویت خبرنامه</h1>
    <p id="msg">در حال پردازش…</p>
    <p><a href="/">بازگشت به فروشگاه</a></p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var email = params.get("email") || "";
      var token = params.get("token") || "";
      var msg = document.getElementById("msg");
      if (!email || !token || token === "test") {
        msg.textContent = token === "test"
          ? "این لینک آزمایشی است و عضویت واقعی را لغو نمی‌کند."
          : "لینک نامعتبر است.";
        return;
      }
      fetch("/api/newsletter/unsubscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ email: email, token: token })
      }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (x) {
          msg.textContent = x.ok
            ? "عضویت شما با موفقیت لغو شد. دیگر ایمیل تبلیغاتی دریافت نخواهید کرد."
            : "لغو عضویت ناموفق بود. لینک منقضی یا نامعتبر است.";
        })
        .catch(function () { msg.textContent = "خطا در ارتباط با سرور."; });
    })();
  </script>
</body>
</html>
